<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habidex — Estilo Combinado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #06060d;
    min-height: 100vh;
    padding: 40px 24px 60px;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .page-header {
    text-align: center;
    margin-bottom: 40px;
  }
  .page-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    letter-spacing: 3px;
    color: #fff;
    text-shadow: 0 0 20px rgba(230,57,70,0.6), 0 0 40px rgba(230,57,70,0.2);
    line-height: 1.6;
  }
  .page-sub {
    font-size: 13px;
    color: #444;
    margin-top: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ── Phone shell ── */
  .phone-frame {
    width: 240px;
    height: 480px;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    border: 3px solid #1a1a2e;
    box-shadow:
      0 0 0 1px rgba(230,57,70,0.15),
      0 24px 80px rgba(0,0,0,0.8),
      0 0 60px rgba(230,57,70,0.1);
  }

  .screen {
    width: 100%; height: 100%;
    background: #08080f;
    font-family: 'Press Start 2P', monospace;
    position: relative;
    overflow: hidden;
  }

  /* Ambient top glow — from C */
  .glow-top {
    position: absolute;
    top: -40px; left: 50%; transform: translateX(-50%);
    width: 320px; height: 160px;
    background: radial-gradient(ellipse, rgba(220,30,30,0.22) 0%, transparent 68%);
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle grid texture — from C */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 18px 18px;
    pointer-events: none;
    z-index: 0;
  }

  /* All content sits above background effects */
  .layer { position: relative; z-index: 1; }

  /* ── Header ── */
  .header {
    background: #110000;
    border-bottom: 2px solid #cc0000;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  /* Red glow under header border */
  .header::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 0; right: 0;
    height: 6px;
    background: radial-gradient(ellipse at center, rgba(204,0,0,0.5) 0%, transparent 70%);
    pointer-events: none;
  }
  .logo {
    font-size: 9px;
    color: #fff;
    letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(230,57,70,0.8), 0 0 24px rgba(230,57,70,0.4);
  }
  .coins {
    font-size: 7px;
    color: #ffd700;
    text-shadow: 0 0 8px rgba(255,215,0,0.8), 0 0 20px rgba(255,215,0,0.3);
    letter-spacing: 1px;
  }

  /* ── Body ── */
  .body {
    padding: 12px 12px 0;
    position: relative;
    z-index: 1;
  }

  .date-row {
    font-size: 5px;
    color: #333;
    letter-spacing: 2px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #151515;
  }

  /* Streak — pixel border + neon glow */
  .streak-box {
    background: #0e0000;
    border: 1px solid #cc0000;
    border-right-color: #600000;
    border-bottom-color: #600000;
    padding: 7px 10px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 0 12px rgba(204,0,0,0.2), inset 0 0 8px rgba(204,0,0,0.06);
  }
  .streak-label {
    font-size: 6px;
    color: #e63946;
    text-shadow: 0 0 8px rgba(230,57,70,0.7);
    letter-spacing: 1px;
  }
  .streak-val {
    font-size: 6px;
    color: #ffd700;
    text-shadow: 0 0 8px rgba(255,215,0,0.8);
    letter-spacing: 1px;
  }

  /* Habit cards — pixel structure + neon accents */
  .habit {
    background: #0a0a0f;
    border: 1px solid #1e1e30;
    padding: 8px 10px;
    margin-bottom: 6px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .habit.done {
    border-color: #1a3a1a;
    box-shadow: 0 0 10px rgba(74,222,128,0.08), inset 0 0 6px rgba(74,222,128,0.04);
  }
  .habit-name {
    font-size: 5px;
    color: #666;
    letter-spacing: 1px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .habit.done .habit-name { color: #4ade80; text-shadow: 0 0 6px rgba(74,222,128,0.5); }
  .done-mark {
    font-size: 5px;
    color: #4ade80;
    text-shadow: 0 0 8px rgba(74,222,128,0.7);
  }
  .dots { display: flex; gap: 3px; }
  /* Pixel dots + neon glow from C */
  .dot {
    width: 6px; height: 6px;
    background: #cc0000;
    box-shadow: 0 0 6px rgba(204,0,0,0.7), 0 0 12px rgba(204,0,0,0.3);
  }
  .dot.e { background: #181818; box-shadow: none; }
  .habit.done .dot { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.7); }
  .habit.done .dot.e { background: #181818; box-shadow: none; }

  /* CTA Button — pixel style */
  .btn-complete {
    margin-top: 14px;
    background: #cc0000;
    border: 0;
    border-bottom: 3px solid #700000;
    border-right: 2px solid #700000;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 5px;
    padding: 9px 0;
    width: 100%;
    text-align: center;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(204,0,0,0.4), 0 0 30px rgba(204,0,0,0.15);
  }

  /* ── Tab Bar ── */
  .tabs {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: #080810;
    border-top: 2px solid #1a1a2a;
    display: flex;
    justify-content: space-around;
    padding: 9px 0 10px;
    z-index: 2;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
  }
  .tab {
    font-size: 5px;
    color: #2a2a3a;
    text-align: center;
    line-height: 2.2;
    letter-spacing: 1px;
  }
  .tab.on {
    color: #e63946;
    text-shadow: 0 0 8px rgba(230,57,70,0.7);
  }

  /* ── Description below phone ── */
  .desc-block {
    margin-top: 32px;
    text-align: center;
    max-width: 420px;
  }
  .desc-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #fff;
    letter-spacing: 2px;
    margin-bottom: 14px;
    text-shadow: 0 0 12px rgba(230,57,70,0.5);
  }
  .desc-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .pill {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    padding: 5px 12px;
    font-size: 12px;
    color: #888;
    letter-spacing: 1px;
  }
  .pill.red { border-color: rgba(204,0,0,0.4); color: #e63946; }
  .pill.gold { border-color: rgba(255,215,0,0.4); color: #ffd700; }
  .pill.green { border-color: rgba(74,222,128,0.3); color: #4ade80; }

  .approve-btn {
    background: transparent;
    border: 1px solid rgba(230,57,70,0.4);
    color: #e63946;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 12px 24px;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(230,57,70,0.15);
    transition: all 0.2s;
  }
  .approve-btn:hover {
    background: rgba(230,57,70,0.08);
    box-shadow: 0 0 24px rgba(230,57,70,0.3);
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title">PIXEL NEON</div>
  <div class="page-sub">Pixel Trainer + Night Gym — sin scanlines</div>
</div>

<div class="phone-frame">
  <div class="screen">
    <div class="glow-top"></div>
    <div class="grid-bg"></div>

    <div class="header layer">
      <span class="logo">★ HABIDEX</span>
      <span class="coins">💰 120 PTS</span>
    </div>

    <div class="body layer">
      <div class="date-row">LUN  21  ABR  2026</div>

      <div class="streak-box">
        <span class="streak-label">🔥 RACHA ACTIVA</span>
        <span class="streak-val">3 DÍAS</span>
      </div>

      <div class="habit done">
        <div class="habit-name">
          <span>► HACER EJERCICIO</span>
          <span class="done-mark">✓ OK</span>
        </div>
        <div class="dots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          <div class="dot e"></div><div class="dot e"></div><div class="dot e"></div><div class="dot e"></div>
        </div>
      </div>

      <div class="habit">
        <div class="habit-name"><span>► LEER 30 MIN</span></div>
        <div class="dots">
          <div class="dot"></div><div class="dot"></div>
          <div class="dot e"></div><div class="dot e"></div><div class="dot e"></div><div class="dot e"></div><div class="dot e"></div>
        </div>
      </div>

      <div class="habit">
        <div class="habit-name"><span>► BEBER AGUA</span></div>
        <div class="dots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
          <div class="dot e"></div><div class="dot e"></div><div class="dot e"></div>
        </div>
      </div>

      <button class="btn-complete">▶  COMPLETAR  HOY</button>
    </div>

    <div class="tabs layer">
      <span class="tab on">⊞<br>HÁBITOS</span>
      <span class="tab">◉<br>POKÉDEX</span>
      <span class="tab">♟<br>PERFIL</span>
    </div>
  </div>
</div>

<div class="desc-block">
  <div class="desc-title">PIXEL NEON</div>
  <div class="desc-pills">
    <span class="pill">Press Start 2P</span>
    <span class="pill red">● Glow rojo</span>
    <span class="pill gold">● Gold neon</span>
    <span class="pill green">● Verde completado</span>
    <span class="pill">Grid sutil</span>
    <span class="pill">Sin scanlines</span>
    <span class="pill">Pixel borders</span>
  </div>
  <button class="approve-btn" data-choice="approve" onclick="toggleSelect(this)">
    ▶ APROBAR ESTE ESTILO
  </button>
</div>

</body>
</html>
